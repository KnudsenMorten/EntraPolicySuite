# Every push and pull request to this repository is scanned for secrets with gitleaks (in addition to GitHub's own
# secret scanning). gitleaks is pinned (8.30.1); its download is checked against the pinned SHA-256 before it runs, and
# --redact keeps a found value out of the log. Rules: gitleaks' defaults + the narrow allowlists in /.gitleaks.toml.
# A finding fails the run.
name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the pushed commits (pinned 8.30.1, checksum verified)
        shell: bash
        env:
          GL_VERSION: 8.30.1
          GL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          f="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          d="$RUNNER_TEMP/gitleaks"; mkdir -p "$d"
          for i in 1 2 3 4 5; do gh release download "v${GL_VERSION}" --repo gitleaks/gitleaks -p "$f" -D "$d" --clobber && break; sleep 10; done
          (cd "$d" && echo "${GL_SHA256}  $f" | sha256sum -c - && tar -xzf "$f" gitleaks)
          ZERO=0000000000000000000000000000000000000000
          has() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          # only commits that are new to this repository: a normal push scans before..after; a new branch or a force push
          # scans the commits that are on no other branch. An empty range is said, not hidden.
          others() { git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v -x "refs/remotes/origin/${GITHUB_REF_NAME}" || true; }
          if [ "$EVENT" = "pull_request" ]; then range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! has "$BEFORE"; then range="$AFTER --not $(others | tr '\n' ' ')"
          else range="$BEFORE..$AFTER"; fi
          n=$(git rev-list --count $range)
          echo "scanning $n commit(s) new to this repository"
          if [ "$n" = "0" ]; then echo "nothing new to scan (the pushed commits are already on another branch)"; exit 0; fi
          "$d/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts="$range" .
